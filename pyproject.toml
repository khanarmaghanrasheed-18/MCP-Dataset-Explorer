[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-explorer-mcp"
version = "0.2.2"
description = "Local MCP analysis for CSV, TSV, Excel, JSON and Parquet: summaries, outliers and relationships."
keywords = ["mcp","model-context-protocol","dataset","data-analysis","eda","pandas","csv","excel","parquet"]
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Armaghan Rasheed"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "openpyxl>=3.1.5",
    "pyarrow>=17.0.0",
    "xlrd>=2.0.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/khanarmaghanrasheed-18/MCP-Dataset-Explorer"
Issues = "https://github.com/khanarmaghanrasheed-18/MCP-Dataset-Explorer/issues"

[project.scripts]
dataset-explorer-mcp = "mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "twine>=6.0"]

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
