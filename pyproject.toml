[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai>=1.0.0",
    "gradio>=5.0.0,<7.0.0",
    "mcp[cli]>=1.8.0,<2.0.0",
    "openpyxl>=3.1.5",
    "pandas",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]

[tool.setuptools]
py-modules = ["agent_service", "app", "dataset_upload", "mcp_client", "mcp_server", "state_store", "web_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
